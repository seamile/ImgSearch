[project]
name = "imgsearch"
dynamic = ["version"]
description = "ImgSearch is a reverse image search engine built on TinyCLIP and LanceDB."
keywords = [
    "image-search",
    "search-by-image",
    "reverse-image-search",
    "image-recognition",
    "lancedb",
    "clip",
    "open-clip",
    "tiny-clip"
]
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Seamile", email = "lanhuermao@gmail.com" }]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "lancedb==0.40.0",
    "numpy>=2.5.3",
    "pyarrow>=26.0.0",
    "msgpack>=1.2.3",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyro5>=5.17",
]
[project.optional-dependencies]
migration = ["bidict>=0.24.1", "hnswlib>=0.8.0"]
server = [
    # PyTorch
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    # TinyCLIP dependencies
    "ftfy>=6.3.1",
    "huggingface-hub>=2.2.0",
    "regex>=2026.9.29",
    "timm>=1.0.30",
    "tqdm>=4.70.1",
]
[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.1.1",
]

[project.scripts]
isearch = "imgsearch.client:main"

[project.urls]
homepage = "https://github.com/seamile/imgsearch"
repository = "https://github.com/seamile/imgsearch"
documentation = "https://seamile.github.io/ImgSearch/"

[build-system]
requires = ["setuptools>=60.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["imgsearch*", "tinyclip*"]

[tool.setuptools.package-data]
"tinyclip" = ["*.gz", "model_configs/*.json"]

[tool.setuptools.dynamic]
version = { attr = "imgsearch.__version__" }
